name: Build in CI
on:
  workflow_dispatch:
  push:
    paths-ignore:
    - '**/.md'
  pull_request:
    paths-ignore:
    - '**/.md'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Test
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup Java
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        java-version: '21'
        distribution: temurin
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
    - name: Build
      run: ./gradlew check --info
      shell: bash
    - name: Release (if required)
      id: get-version
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.TOOLBOX_REPO_TOKEN }}
      shell: bash
    - name: Repository Dispatch
      if: (github.ref == 'refs/heads/main' && steps.get-version.outputs.tag-created == 'true')
      run: |-
        curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/${{ github.repository }}/dispatches \
          -d '{"event_type":"release","client_payload":{"tag":"${{ steps.get-version.outputs.tag }}"}}'
      env:
        GH_TOKEN: ${{ secrets.TOOLBOX_REPO_TOKEN }}
      shell: bash